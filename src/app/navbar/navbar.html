<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" [href]="asRouteHome.path">{{ asRouteHome.text }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <div class="navbar-nav me-auto">
        @for (asRoute of asRouteList; track asRoute.path) {
          <a class="nav-link" [href]="'/' + asRoute.path">{{asRoute.text}}</a>
        }
      </div>
      <div class="d-flex">
        <button class="btn btn-primary" type="button" (click)="contact()">Contact</button>
      </div>
    </div>
  </div>
</nav>
